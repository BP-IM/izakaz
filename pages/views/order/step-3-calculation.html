<section
  id="order-step-calculation"
  class="step3-page"
>

  <!-- =====================================================
       HEADER
  ====================================================== -->

  <header class="step3-header">

    <div>

      <p class="step3-kicker">
        ШАГ 3 ИЗ 4
      </p>

      <h2>
        Расчет заказа
      </h2>

      <p class="step3-description">
        Прогноз остатка и рекомендуемое количество заказа
      </p>

    </div>


    <div class="step3-order-meta">

      <div class="step3-meta-item">

        <span>
          Подсчет
        </span>

        <strong id="step3-count-date">
          —
        </strong>

      </div>


      <div class="step3-meta-item">

        <span>
          Заказ
        </span>

        <strong id="step3-order-date">
          —
        </strong>

      </div>

    </div>

  </header>


  <!-- =====================================================
       TABS
  ====================================================== -->

  <nav
    class="step3-tabs"
    aria-label="Разделы расчета"
  >

    <button
      class="step3-tab is-active"
      type="button"
      data-step3-tab="cola"
    >
      Cola
    </button>


    <button
      class="step3-tab"
      type="button"
      data-step3-tab="general"
    >
      Основные
    </button>


    <button
      class="step3-tab"
      type="button"
      data-step3-tab="fresh"
    >
      Fresh
    </button>

  </nav>


  <!-- =====================================================
       STATUS
  ====================================================== -->

  <div
    id="step3-status"
    class="step3-status"
  >
    Загрузка расчета...
  </div>


  <!-- =====================================================
       COLA
  ====================================================== -->

  <section
    id="step3-panel-cola"
    class="step3-panel is-active"
    data-step3-panel="cola"
  >

    <div
      id="step3-cola-summary"
      class="step3-cola-summary"
    >
    </div>


    <div
      id="step3-cola-warning"
      class="step3-cola-warning"
      hidden
    >
    </div>


    <div
      id="step3-cola-list"
      class="step3-cola-list"
    >
    </div>

  </section>


  <!-- =====================================================
       GENERAL
  ====================================================== -->

  <section
    id="step3-panel-general"
    class="step3-panel"
    data-step3-panel="general"
    hidden
  >

    <div class="step3-coming-card">

      <div class="step3-coming-icon">
        ▦
      </div>

      <h3>
        Основные товары
      </h3>

      <p>
        Расчет основных товаров подключим следующим этапом.
      </p>

    </div>

  </section>


  <!-- =====================================================
       FRESH
  ====================================================== -->

  <section
    id="step3-panel-fresh"
    class="step3-panel"
    data-step3-panel="fresh"
    hidden
  >

    <div class="step3-coming-card">

      <div class="step3-coming-icon">
        ◷
      </div>

      <h3>
        Fresh
      </h3>

      <p>
        Здесь будет расчет по партиям и срокам годности FEFO.
      </p>

    </div>

  </section>


  <!-- =====================================================
       FOOTER
  ====================================================== -->

  <footer class="step3-footer">

    <button
      id="step3-back-button"
      class="step3-button"
      type="button"
    >
      ← Назад
    </button>


    <div class="step3-footer-note">
      Сейчас выполняется расчет Cola
    </div>


    <button
      id="step3-next-button"
      class="step3-button is-primary"
      type="button"
      disabled
      title="Сначала завершим Основные и Fresh"
    >
      Далее →
    </button>

  </footer>

</section>
