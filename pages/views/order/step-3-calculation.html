<section
  id="order-step-calculation"
  class="step3-page"
>

  <!-- =====================================================
       HEADER
  ====================================================== -->

  <header class="step3-header">

    <div>

      <p class="step3-kicker">
        ШАГ 3 ИЗ 4
      </p>

      <h2>
        Расчет заказа
      </h2>

      <p class="step3-description">
        Прогноз остатка и рекомендуемое количество заказа
      </p>

    </div>


    <div class="step3-order-meta">

      <div class="step3-meta-item">

        <span>
          Подсчет
        </span>

        <strong id="step3-count-date">
          —
        </strong>

      </div>


      <div class="step3-meta-item">

        <span>
          Заказ
        </span>

        <strong id="step3-order-date">
          —
        </strong>

      </div>

    </div>

  </header>


  <!-- =====================================================
       TABS
  ====================================================== -->

  <nav
    class="step3-tabs"
    aria-label="Категории заказа"
  >

    <button
      class="step3-tab is-active"
      type="button"
      data-step3-tab="cola"
    >
      Cola
    </button>


    <button
      class="step3-tab"
      type="button"
      data-step3-tab="fresh"
    >
      Fresh
    </button>


    <button
      class="step3-tab"
      type="button"
      data-step3-tab="freezer"
    >
      Freezer
    </button>


    <button
      class="step3-tab"
      type="button"
      data-step3-tab="cooler"
    >
      Cooler
    </button>


    <button
      class="step3-tab"
      type="button"
      data-step3-tab="dry"
    >
      Сухой
    </button>

  </nav>


  <!-- =====================================================
       STATUS
  ====================================================== -->

  <div
    id="step3-status"
    class="step3-status"
  >
    Загрузка расчета...
  </div>


  <!-- =====================================================
       COLA
  ====================================================== -->

  <section
    id="step3-panel-cola"
    class="step3-panel is-active"
    data-step3-panel="cola"
  >

    <div
      id="step3-cola-summary"
      class="step3-cola-summary"
    ></div>


    <div
      id="step3-cola-warning"
      class="step3-cola-warning"
      hidden
    ></div>


    <div
      id="step3-cola-list"
      class="step3-cola-list"
    ></div>

  </section>


  <!-- =====================================================
       FRESH
  ====================================================== -->

  <section
    id="step3-panel-fresh"
    class="step3-panel"
    data-step3-panel="fresh"
    hidden
  >
  </section>


  <!-- =====================================================
       FREEZER
  ====================================================== -->

  <section
    id="step3-panel-freezer"
    class="step3-panel"
    data-step3-panel="freezer"
    hidden
  >
  </section>


  <!-- =====================================================
       COOLER
  ====================================================== -->

  <section
    id="step3-panel-cooler"
    class="step3-panel"
    data-step3-panel="cooler"
    hidden
  >
  </section>


  <!-- =====================================================
       DRY
  ====================================================== -->

  <section
    id="step3-panel-dry"
    class="step3-panel"
    data-step3-panel="dry"
    hidden
  >
  </section>


  <!-- =====================================================
       FOOTER
  ====================================================== -->

  <footer class="step3-footer">

    <button
      id="step3-back-button"
      class="step3-button"
      type="button"
    >
      ← Назад
    </button>


    <div class="step3-footer-note">
      Расчет Cola готов
    </div>


    <button
      id="step3-next-button"
      class="step3-button is-primary"
      type="button"
      disabled
    >
      Далее →
    </button>

  </footer>

</section>
