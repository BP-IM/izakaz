
<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="IZAKAZ — система заказов и инвентаризации"
  >

  <title>IZAKAZ</title>

  <script>
    (function () {
      try {
        if (localStorage.getItem("izakaz-theme") === "dark") {
          document.documentElement.setAttribute("data-theme", "dark");
        }
      } catch (_) {
        // Theme.js will use the default light theme when storage is unavailable.
      }
    })();
  </script>

  <!-- PWA -->
  <link
    rel="manifest"
    href="../manifest.webmanifest"
  >

  <meta
    name="theme-color"
    content="#17181a"
  >

  <!-- ICONS -->
  <link
    rel="icon"
    type="image/png"
    href="../assets/images/izakaz-icon.png"
  >

  <link
    rel="apple-touch-icon"
    href="../assets/images/izakaz-icon.png"
  >

  <!-- FONT -->
  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  >

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >

  <!-- =====================================

  ====================================== -->

  <link

  <link
    rel="stylesheet"

  <link
    rel="stylesheet"

  ====================================== -->

  <link

  <link
